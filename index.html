<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise Budget Calculator</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="container"><section class="card">
<p class="eyebrow">SpendWise</p><h1>Budget Calculator</h1>
<p class="intro">Plan your spending, calculate your remaining balance, and make smarter budget decisions.</p>
<div class="summary">
<div><span>Budget</span><strong id="budgetDisplay">$0.00</strong></div>
<div><span>Total expenses</span><strong id="expensesDisplay">$0.00</strong></div>
<div><span>Remaining</span><strong id="remainingDisplay">$0.00</strong></div>
</div>
<div class="actions"><button id="startButton" type="button">Enter Budget &amp; Expenses</button><button id="resetButton" class="secondary" type="button">Reset</button></div>
<p id="status" class="status" aria-live="polite">Click the button to enter your budgeting information.</p>
<p class="hint">Open your browser console to view clearly labeled calculation results.</p>
</section></main>
</body></html>
